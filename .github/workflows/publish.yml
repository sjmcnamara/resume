name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - run: pip install -r requirements.txt

      # Cards come out of resume.json, and MkDocs needs the snippet on disk
      # before it builds, so this has to run first.
      - name: Generate the project cards
        run: python3 build.py --emit-cards

      - name: Build the site
        run: mkdocs build --strict

      # The sheet is written into the built site rather than rendered through
      # MkDocs: Material's stylesheet would otherwise reflow the print layout.
      # The PDF lands at the site root so /stephen-mcnamara.pdf keeps working.
      - name: Build the résumé + PDF (fails if it spills to a second page)
        run: python3 build.py --pdf --check --out site/resume --pdf-out site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
