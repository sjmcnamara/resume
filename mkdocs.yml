site_name: Stephen McNamara
site_url: https://sjmcnamara.com
site_description: >-
  Technology executive with three decades in payments and crypto. Currently
  building an inheritable multi-chain assisted self-custody vault.
site_author: Stephen McNamara

# The sheet under /resume/ is rendered by build.py, not by MkDocs, so it never
# appears in the nav and MkDocs never sees the directory.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  # Naming fonts here makes Material load them from fonts.googleapis.com and
  # fonts.gstatic.com on every visit. `false` uses the system stack instead —
  # no third-party requests, and the same -apple-system family the résumé sheet
  # already uses, so the two pages match rather than diverge.
  font: false
  favicon: assets/favicon.svg
  # No `features`: instant loading has nothing to navigate between on a
  # one-page site, and the only outbound link — /resume/ — isn't a MkDocs page
  # for it to swap in anyway.
  # Dark first, and neither entry carries a `media` key: the first is the default
  # for everyone regardless of system preference, and the toggle still switches
  # and remembers. The mac-window motif is built for the dark scheme.
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

# One page has nothing to search, and the empty search box only clutters the
# title bar the mac-window motif turns the header into.
plugins: []

extra_css:
  - assets/home.css

markdown_extensions:
  - attr_list
  - md_in_html
  - smarty
  # `custom_icons` is what registers icons Material doesn't ship — a directory
  # outside docs_dir, indexed as `:<subdir>-<filename>:`. The Nostr ostrich is in
  # none of the bundled fontawesome/material/octicons/simple sets, so
  # icons/custom/nostr.svg becomes `:custom-nostr:`. This is the emoji
  # extension's option, not theme.custom_dir — that one is only for templates.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - icons
  # Cards are generated from resume.json into docs/.generated/ — a dot-prefixed
  # directory so MkDocs skips it as a page and only the snippet include picks
  # it up. Run `python3 build.py --emit-cards` before serving or building.
  - pymdownx.snippets:
      base_path: [docs/.generated]
      check_paths: true

# `social` would only render into Material's footer bar, which the mac-window
# layout hides — the hero carries those links itself.
extra:
  generator: false

# Single page: nothing to navigate to, so the top-level nav stays empty.
nav:
  - Home: index.md
